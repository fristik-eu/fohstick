name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    name: macOS (.dmg)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "ver=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; else echo "ver=" >> "$GITHUB_OUTPUT"; fi
      - name: Build
        run: bash build/build_mac.sh ${{ steps.v.outputs.ver }}
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/*.dmg

  windows:
    name: Windows (.zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') { "ver=$($env:GITHUB_REF_NAME.TrimStart('v'))" >> $env:GITHUB_OUTPUT } else { "ver=" >> $env:GITHUB_OUTPUT }
      - name: Generate
        run: python build/gen.py ${{ steps.v.outputs.ver }}
      - name: Build
        shell: powershell
        run: |
          $v = '${{ steps.v.outputs.ver }}'
          powershell -NoProfile -ExecutionPolicy Bypass -File build/build_win.ps1 -Version $v
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Release notes
        run: |
          python3 - <<'PY'
          import json, re, os
          ver = os.environ['GITHUB_REF_NAME'].lstrip('v')
          log = open('CHANGELOG.md', encoding='utf-8').read()
          m = re.search(r'## \[?' + re.escape(ver) + r'\]?.*?\n(.*?)(?=\n## |\Z)', log, re.S)
          open('notes.md', 'w', encoding='utf-8').write((m.group(1).strip() if m else 'FOHstick ' + ver) + '\n')
          PY
      - uses: softprops/action-gh-release@v2
        with:
          name: FOHstick ${{ github.ref_name }}
          body_path: notes.md
          files: |
            dist/mac/*.dmg
            dist/windows/*.zip
